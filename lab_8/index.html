<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="hamburger" onclick="toggleMenu()">
            ☰
        </div>

        <ul class="menu" id="menu">

            <li>
                <span class="icon">🏠</span>
                Головна
            </li>

            <li>
                <span class="icon">📷</span>
                Галерея
            </li>

            <li>
                <span class="icon">📞</span>
                Контакти
            </li>

            <li>
                <span class="icon">ℹ️</span>
                Про нас
            </li>

        </ul>

    </header>

    <!-- Карусель -->

    <div class="carousel">

        <div class="slides" id="slides">

            <div class="slide">
                <img src="https://placehold.co/900x400/orange/white?text=Slide+1">
            </div>

            <div class="slide">
                <img src="https://placehold.co/900x400/blue/white?text=Slide+2">
            </div>

            <div class="slide">
                <img src="https://placehold.co/900x400/green/white?text=Slide+3">
            </div>

            <div class="slide">
                <img src="https://placehold.co/900x400/red/white?text=Slide+4">
            </div>

        </div>

        <button class="prev" onclick="moveSlide(-1)">❮</button>
        <button class="next" onclick="moveSlide(1)">❯</button>

    </div>

    <!-- Точки -->

    <div class="dots">

        <span class="dot active" onclick="currentSlide(0)"></span>

        <span class="dot" onclick="currentSlide(1)"></span>

        <span class="dot" onclick="currentSlide(2)"></span>

        <span class="dot" onclick="currentSlide(3)"></span>

    </div>

    <!-- Large -->

    <div class="gallery large-only">

        <img src="https://placehold.co/300x200/purple/white?text=Large+1">

        <img src="https://placehold.co/300x200/black/white?text=Large+2">

        <img src="https://placehold.co/300x200/gray/white?text=Large+3">

    </div>

    <!-- Medium -->

    <div class="gallery medium-only">

        <img src="https://placehold.co/250x150/yellow/black?text=Medium+1">

        <img src="https://placehold.co/250x150/pink/black?text=Medium+2">

        <img src="https://placehold.co/250x150/cyan/black?text=Medium+3">

    </div>

    <script src="script.js"></script>

</body>

</html>
